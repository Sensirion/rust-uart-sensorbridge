[package]
name = "rust-uart-sensorbridge"
version = "0.1.0"
edition = "2021"
authors = ["Sensirion AG"]
description = "High-performance sync and async Rust SEK-SensorBridge driver with PyO3 Python bindings"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "sensirion_uart_sensorbridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-shdlc-driver = { version = "0.1.0", default-features = false }
pyo3 = { version = "0.23", features = ["abi3-py311"], optional = true }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"], optional = true }
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
byteorder = "1.5"
bytes = "1.9"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
rust-shdlc-driver = { version = "0.1.0", features = ["serial"] }
tokio-test = "0.4"
tracing-subscriber = "0.3"

[features]
default = ["serial"]
extension-module = ["pyo3/extension-module"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "rust-shdlc-driver/python"]
serial = ["rust-shdlc-driver/serial"]

[[example]]
name = "rust_sync_usage"
path = "examples/rust_sync_usage.rs"

[[example]]
name = "rust_async_usage"
path = "examples/rust_async_usage.rs"

[[example]]
name = "test_hw"
path = "examples/test_hw.rs"
